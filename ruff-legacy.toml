# 从 askdb 搬入的代码（app/legacy/）专用的宽松 lint 配置。
#
# 目的不是"合规"，而是**可见性**：让 CI 报告还有多少遗留问题，
# 同时不阻塞新代码的合并。CI 里这个 job 是 continue-on-error。
#
# 收敛路线：每重写/删除一个 legacy 模块，就从 app/legacy/ 移出，
# 直到 ruff-legacy.toml 可以整份删除。

line-length = 120
target-version = "py312"

[lint]
# 只检查真正会导致运行时问题的类别，风格问题全部忽略
select = [
    "F",    # pyflakes：未定义名、未使用导入（会真的崩）
    "E9",   # 语法/缩进错误
]
ignore = [
    "F401",  # 未使用导入 —— 搬来的代码里非常多，先忽略
    "F841",  # 未使用变量
]

[lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
