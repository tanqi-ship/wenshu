[project]
name = "wenshu"
version = "0.1.0"
description = "银行级智能问数引擎：语义层 + 编译器 + 有界检索 + 槽位澄清"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# 依赖刻意保持精简：不引入 LangChain 等重型框架。
# 来源：askdb/backend/requirements.txt（16 项），经作者许可。
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-multipart==0.0.32",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "httpx==0.28.1",
    "sqlalchemy==2.0.50",
    "pymysql==1.2.0",
    "psycopg[binary]==3.3.2",
    "oracledb==4.0.1",
    "sqlglot==29.0.1",
    "cryptography==48.0.0",
    "PyJWT[crypto]==2.13.0",
    "bcrypt==5.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.5",
    "PyYAML>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff —— 分圈策略
#   app/legacy/ 是从 askdb 搬进来的代码，暂不参与 lint（见 ruff-legacy.toml）
#   新代码（app/engine, app/llm, scripts, tests）从严
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/legacy", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # 行长由 formatter 负责
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]           # assert False 在测试里可接受
"scripts/**" = ["T201"]         # 脚本允许 print

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "dual: 双引擎对照测试（慢，需要 baseline）",
    "db: 需要真实数据库连接",
    "oracle: 需要 Oracle 连接（nightly）",
]
