# CI 流水线。
#
# 设计原则（借鉴 auto-ontology 的 ci-python.yml，Apache-2.0）：
#   1. 分圈：新引擎代码严格，从 askdb 搬来的代码先用 continue-on-error 观察
#   2. CI 绝不调用真实 LLM / embedding（不可复现、要联网、会超时、花钱）
#   3. 测试静默跳过 = 失败。一个绿的但少跑了一半用例的流水线毫无价值

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 快圈：只检查新写的代码
  # -------------------------------------------------------------------------
  lint:
    name: Ruff (new engine code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
          args: check
          src: "./app/engine ./app/llm ./scripts ./tests"

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
          args: format --check
          src: "./app/engine ./app/llm ./scripts ./tests"

  # -------------------------------------------------------------------------
  # 慢圈：搬来的 askdb 代码，非阻塞
  # 等新引擎稳定后逐步收紧，最终去掉 continue-on-error
  # -------------------------------------------------------------------------
  lint-legacy:
    name: Ruff (inherited askdb code, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Ruff lint (legacy)
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
          args: check --config ruff-legacy.toml
          src: "./app/legacy"

  # -------------------------------------------------------------------------
  # 测试：pgvector service + 假 LLM
  # -------------------------------------------------------------------------
  tests:
    name: Pytest (fixture DB, replay LLM)
    runs-on: ubuntu-latest

    # pgvector 而非 stock postgres：向量列与 <-> 运算符只在 pgvector 镜像里有。
    # 版本必须与 docker-compose.yml 一致，否则本机能过 CI 不过。
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: wenshu
          POSTGRES_PASSWORD: wenshu
          POSTGRES_DB: wenshu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenshu -d wenshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      WENSHU_ENV: ci
      # 关键：CI 使用回放模式，绝不联网调模型
      WENSHU_LLM_MODE: replay
      WENSHU_LLM_CASSETTE_DIR: tests/cassettes
      # 回放模式下找不到 cassette 必须硬失败，而不是回落到真实调用
      WENSHU_LLM_STRICT_REPLAY: "1"
      WENSHU_DATABASE_URL: postgresql+psycopg://wenshu:wenshu@localhost:5432/wenshu
      WENSHU_FIXTURE_URL: postgresql+psycopg://wenshu:wenshu@localhost:5432/bankfixture

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # 首次提交还没有 uv.lock，所以不用 --locked；
        # 生成锁文件后请改为 `uv sync --locked --group dev`
        run: uv sync --group dev

      - name: Seed the bank fixture database
        run: uv run --no-sync python -m scripts.seed_fixture

      - name: Run tests
        run: uv run --no-sync pytest --durations=10

      # 静默跳过是绿流水线的头号谎言：某个 fixture 连不上时用例被 skip，
      # 整个 job 仍然通过，测试却什么也没证明。
      - name: Fail if tests silently skipped
        run: |
          skipped=$(uv run --no-sync pytest -rs 2>/dev/null | grep -c '^SKIPPED' || true)
          echo "skipped: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped tests skipped; expected 0."
            uv run --no-sync pytest -rs 2>/dev/null | grep '^SKIPPED' || true
            exit 1
          fi

  # -------------------------------------------------------------------------
  # 双引擎对照门禁：旧对→新错 是绝对红线
  # 需要 baseline 文件；在 Step 0 产出之前这个 job 会跳过
  # -------------------------------------------------------------------------
  regression:
    name: Dual-engine regression gate
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ hashFiles('eval/baseline_report.json') != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --group dev

      - name: Compare new engine against baseline
        env:
          WENSHU_LLM_MODE: replay
          WENSHU_LLM_CASSETTE_DIR: tests/cassettes
          WENSHU_LLM_STRICT_REPLAY: "1"
        run: |
          uv run --no-sync python -m scripts.check_regression \
            --baseline eval/baseline_report.json \
            --output eval/current_report.json

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            eval/current_report.json
            eval/regression_summary.md
          retention-days: 14
