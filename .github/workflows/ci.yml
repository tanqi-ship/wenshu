# CI 流水线。
#
# 设计原则（借鉴 auto-ontology 的 ci-python.yml，Apache-2.0）：
#   1. CI 绝不调用真实 LLM / embedding（不可复现、要联网、会超时、花钱）
#   2. 测试静默跳过 = 失败。一个绿的但少跑了一半用例的流水线毫无价值
#   3. 默认不需要数据库：M1~M3 的编译器与校验都是纯内存（ADR-0006）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 静态检查：全部代码一律从严（本项目不迁移外部代码，见 ADR-0003）
  # -------------------------------------------------------------------------
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
          args: check
          src: "./app ./scripts ./tests"

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.5"
          args: format --check
          src: "./app ./scripts ./tests"

  # -------------------------------------------------------------------------
  # 测试：纯内存 + 回放 LLM，不需要数据库
  # -------------------------------------------------------------------------
  tests:
    name: Pytest (in-memory, replay LLM)
    runs-on: ubuntu-latest

    env:
      WENSHU_ENV: ci
      # 关键：CI 使用回放模式，绝不联网调模型
      WENSHU_LLM_MODE: replay
      WENSHU_LLM_CASSETTE_DIR: tests/cassettes
      # 回放模式下找不到 cassette 必须硬失败，而不是回落到真实调用
      WENSHU_LLM_STRICT_REPLAY: "1"
      # 刻意不设 WENSHU_FIXTURE_URL：M1~M3 的编译器与校验层是纯函数，
      # 全仓没有任何用例连接数据库（ADR-0006）。设了它反而会诱导后面的人
      # 写"顺手灌个库"的步骤，而那一步需要 PG 专有语句。

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        # uv.lock 已入库，用 --locked 保证 CI 用的依赖与本地完全一致；
        # 谁改了 pyproject 却忘了更新锁文件，这一步会直接失败而不是悄悄升级。
        run: uv sync --locked --group dev

      # 刻意不灌 fixture：这一 job 跑的是纯内存用例，一行 SQL 都不连库。
      # fixtures/sql/bank_fixture.sql 是 PostgreSQL 方言（COMMENT ON / numeric(...)），
      # 塞不进 sqlite:/// —— 真需要数据库的用例打 @pytest.mark.db，
      # 由下面 tests-db 这个非阻塞 job 负责（M4 验方言时才启用）。
      - name: Run tests
        run: uv run --no-sync pytest --durations=10 -m "not db and not oracle"

      # 静默跳过是绿流水线的头号谎言：某个 fixture 连不上时用例被 skip，
      # 整个 job 仍然通过，测试却什么也没证明。
      - name: Fail if tests silently skipped
        run: |
          skipped=$(uv run --no-sync pytest -rs -m "not db and not oracle" 2>/dev/null | grep -c '^SKIPPED' || true)
          echo "skipped: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped tests skipped; expected 0."
            uv run --no-sync pytest -rs -m "not db and not oracle" 2>/dev/null | grep '^SKIPPED' || true
            exit 1
          fi

  # -------------------------------------------------------------------------
  # 需要真实数据库的用例（方言 / EXPLAIN）。可选，非阻塞，nightly 再收紧。
  #
  # ⚠️ 本 job 目前**还没有任何用例**：全仓零处 @pytest.mark.db。
  #    启用前必须先解决三处（否则它是"看起来在测什么"的假象）：
  #      1. WENSHU_FIXTURE_URL 用了 SQLAlchemy 写法 postgresql+psycopg://，
  #         而 scripts/seed_fixture.py 是直接 psycopg.connect()，需要 postgresql://
  #      2. 建库名要跟 POSTGRES_DB=wenshu 对齐（现在 URL 里写的是 bankfixture）
  #      3. 用例数为 0 时 pytest 退出码是 5，job 会红——被 continue-on-error 掩盖了
  #    真正的触发时机是 M4（需要验 Oracle / PG 方言差异时，见 ADR-0006）。
  # -------------------------------------------------------------------------
  tests-db:
    name: Pytest (postgres dialect)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wenshu
          POSTGRES_PASSWORD: wenshu
          POSTGRES_DB: wenshu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wenshu -d wenshu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      WENSHU_ENV: ci
      WENSHU_LLM_MODE: replay
      WENSHU_LLM_CASSETTE_DIR: tests/cassettes
      WENSHU_LLM_STRICT_REPLAY: "1"
      WENSHU_FIXTURE_URL: postgresql+psycopg://wenshu:wenshu@localhost:5432/bankfixture

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Seed fixture (postgres)
        run: uv run --no-sync python -m scripts.seed_fixture
      - name: Run db-marked tests
        run: uv run --no-sync pytest -m "db or oracle" --durations=10

  # -------------------------------------------------------------------------
  # 黄金集门禁：引擎产出 vs 手工黄金 SQL（M1.5）。
  # 只比 SQL 文本：**不需要数据库、不需要模型**（ADR-0006）。
  # -------------------------------------------------------------------------
  golden:
    name: Golden-set gate
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ hashFiles('eval/golden/cases.yaml') != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      # 刻意不灌库：门禁比的是 SQL 结构，不是结果集。
      # 灌 fixture 要 psycopg + PG 专有语句（ADR-0006 的未决项），
      # 让它在这里失败，等于因为与门禁无关的原因把门禁判红。
      - name: Compare engine output against golden SQL
        run: |
          uv run --no-sync python -m scripts.check_golden \
            --golden eval/golden \
            --cases eval/cases \
            --output eval/golden_report.json

      - name: Upload golden report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-report
          path: |
            eval/golden_report.json
            eval/golden_summary.md
          retention-days: 14
