# 黄金集：手写标准 SQL + 对应的 Intent
#
# 这个文件回答一个问题：**给我一个 Intent，引擎该产出哪条 SQL？**
# 答案在旁边的 <id>.sql 里，是**手写**的，不是引擎产出的。
#
# 每条用例四要素：
#
#   id         G-xxx。刻意与评测集（eval/cases 的 AQ-xxx）分开编号 ——
#              两者曾经撞号：同一个 AQ-001 在这里是不良贷款余额、
#              在评测集里是贷款余额。撞号会让门禁和评测报告互相污染。
#   shape      形状标签。M2 每加一种形状，这里多一个值；一眼能看出覆盖了哪些形状。
#   intent     编译器的输入。**只能用接口语言写**（指标名/时间/维度/过滤），
#              不许出现 SQL 片段 —— 否则黄金集就变成"人教编译器写 SQL"了。
#   golden     黄金 SQL 文件名（相对本目录）。
#
# 可选：
#   eval_case  对应的评测用例编号。用于交叉检查"哪些评测用例还没有黄金对照"。
#              **没有对应项就留空**，不要硬凑 —— 硬凑的对照会掩盖差异。
#   covers     覆盖的业务规则编号（C-xx / R-xxx / D-xx）。
#
# 纪律：每加一种 SQL 形状，必须同时交三样 = 黄金 SQL + 单测 + covers 标注。
#
# 时间写法说明：points 必须写**具体日期**，不写"4月末"这种说法。
# "4月末 → 2026-04-30"的推算在 compiler/time.py::month_end_range，
# 属于编译器侧；加载器不猜日期（app/engine/semantic/models.py::intent_from_mapping）。

- id: G-001
  shape: month_end_single_point
  intent:
    metric: 不良贷款余额
    time:
      grain: month_end
      points: ["2026-04-30"]
  golden: G-001.sql
  covers: [R-NAME-001]
  why_hard: |
    看似最简单的一条，但有两个坑：
    ① etl_dt 是月末快照，必须**精确等值** 2026-04-30，
       不能用 MAX(etl_dt) 也不能用 <= / BETWEEN（否则跨期累加）；
    ② "不良"= 五级分类 30/40/50 的余额之和，不是"逾期天数 > 0"。
       fixture 里 LN0005 的 overdue_day 是 NULL，按逾期判断会漏算。
    第 ② 点**任何校验规则都抓不到**，只能靠这条黄金 SQL 钉住。

- id: G-002
  shape: month_end_single_point
  intent:
    metric: 贷款余额
    time:
      grain: month_end
      points: ["2026-04-30"]
  golden: G-002.sql
  eval_case: AQ-001
  covers: [R-NAME-001]
  why_hard: |
    这个指标的公式在语义层里**不带** {tbl} 占位符（SUM(current_balnc_cny)），
    靠 compiler/metrics.py::qualify_columns 补表别名。
    所以它钉住的是"补别名"这件事：少一个 t1. 前缀也算不一致。
    同时它是唯一有评测用例对照的一条（AQ-001），用来验证交叉检查真的在工作。

# ---------------------------------------------------------------------------
# 以下三条是 M1.5 之后的"补票"：编译器已经会这几种形状，但此前只有单测、
# 没有黄金 SQL 钉住。补票的顺序是"先钉住已有的，再扩新的"——
# 否则 M2 每加一种形状，都是在没有对照物的地基上加。
# ---------------------------------------------------------------------------

- id: G-003
  shape: dimension_grouping
  intent:
    metric: 贷款余额
    time:
      grain: month_end
      points: ["2026-04-30"]
    dimensions: [机构]
  golden: G-003.sql
  eval_case: AQ-005
  covers: [R-NAME-001, C-11, D-01]
  why_hard: |
    维度分组最容易出的错是"名称列跟着进了 GROUP BY"——语句能跑、
    结果看起来也合理，只是同一个机构被拆成好几行（名字有空格差异、简称差异）。
    这条钉的是形状：GROUP BY 只有 org_no，org_nm 只以 MAX(...) 出现。
    第②个坑是口径：机构默认走财务口径 org_no，而不是 accounting_org_no。
    fixture 里两者 99% 相同、5% 不同（D-01），选错了大部分机构看不出来。

- id: G-004
  shape: business_filter_eq
  intent:
    metric: 不良贷款余额
    time:
      grain: month_end
      points: ["2026-04-30"]
    filters:
      - dimension: 机构
        value: 渝北支行
  golden: G-004.sql
  eval_case: AQ-002
  covers: [D-01, D-06]
  why_hard: |
    Intent 里是业务语言「渝北支行」，SQL 里必须是存储值 'B001'（code_map 翻译）。
    这是全仓最阴的一类错：如果翻译没发生，SQL 是 org_no = '渝北支行'，
    语法合法、L4 六条规则全绿、能跑出结果——只是结果恒为 0 行。
    **没有任何一层会报错**，只有黄金集能发现。
    反过来同样错：把它写成 LIKE '%渝北%' / 前缀匹配会把下级机构卷进来（D-06）。

- id: G-005
  shape: range_between
  intent:
    metric: 贷款余额
    time:
      grain: range
      start: "2026-01-31"
      end: "2026-06-30"
  golden: G-005.sql
  eval_case: AQ-009
  covers: [D-10]
  why_hard: |
    ① 区间边界必须是**月末快照日期**（2026-01-31，不是 2026-01-01）——
       但那个推算是 L1/L2 的活，编译器只把给它的两个日期原样变成闭区间。
    ② 必须是闭区间 BETWEEN。写成 >= 起 AND < 止 会漏掉 6 月末那个快照，
       少一个月，数字只差一点，看不出来。
    ③ 口径提醒：余额是时点存量，对 6 个月末快照求和没有业务意义。
       这条用例钉的是**形状**，不是认可这个口径。区间形态真正适用的是
       流量类指标（核销金额/回收金额），那属于 M2 后续用例。

# ---------------------------------------------------------------------------
# 以下两条是**权限形状**：编译器的三个输入里，Intent 完全相同，
# 差异全部来自 scope（ADR-0004）。这是黄金集里唯一能端到端钉住权限的地方 ——
# 在此之前权限只有单测，没有"从 Intent + Scope 到 SQL 文本"的对照。
# ---------------------------------------------------------------------------

- id: G-006
  shape: row_policy_injection
  intent:
    metric: 不良贷款余额
    time:
      grain: month_end
      points: ["2026-04-30"]
  scope:
    tables: [qa_loan_acc_detail]
    row_policies:
      - table: qa_loan_acc_detail
        column: org_no
        operator: in
        values: ["B001", "B002"]
  golden: G-006.sql
  covers: [C-05]
  why_hard: |
    同样的 Intent，换个身份就该换条 SQL —— 差异不在 Intent 里，在 scope 里。
    两个坑：① 权限条件必须是 AND 上去的，不能覆盖时间条件（否则跨月累加）；
    ② 合成顺序固定为 时间 → 业务 → 权限，顺序本身是被钉住的契约，
    因为下游"改条件重跑"要靠"最后一段是权限"来保证它不被改动。

- id: G-007
  shape: row_policy_fail_closed
  intent:
    metric: 不良贷款余额
    time:
      grain: month_end
      points: ["2026-04-30"]
  scope:
    tables: [qa_loan_acc_detail]
    row_policies:
      - table: qa_loan_acc_detail
        column: org_no
  golden: G-007.sql
  covers: [C-05]
  why_hard: |
    策略配了、取值没了（权限数据没同步）——此时"静默跳过策略"会让人看到全行数据，
    而且不报错、不告警、跑得还挺快。这条钉住 fail-closed：多一个恒假合取项 1 = 0，
    而不是把整个 WHERE 变成 1 = 0（后者丢掉审计痕迹：看不出查的是哪个时点）。
    注意 values 是**故意留空**的，加载器不许把它当成"没配策略"。

# ---------------------------------------------------------------------------
# M2.1：双时点对比 delta。
# 三条硬约束都写在 cases.yaml 里而不是 prompt 里：comparison=delta、
# 恰好两个时点、顺序为"当前、基准"。违反任一条都是编译期显式报错。
# ---------------------------------------------------------------------------

- id: G-008
  shape: comparison_delta
  intent:
    metric: 贷款余额
    time:
      grain: month_end
      points: ["2026-04-30", "2026-01-31"]
    comparison: delta
  golden: G-008.sql
  eval_case: AQ-004
  covers: [C-05]
  why_hard: |
    ① 两个时点必须一条 SELECT 一次筛出（WHERE etl_dt IN），不能用标量子查询
       去查基准时点 —— 数据缺失时子查询静默返回 NULL/0，数字看着还挺像。
    ② 差值只能重复写两遍完整表达式：同一 SELECT 里不能引用本层别名
       cur_balance - base_balance 在任何数据库都不合法。
    ③ 三列都要返回（当前值、基准值、差值），不能只给 delta。
    ④ 时点顺序是"当前在前、基准在后"。反了 SQL 照样跑，只是 delta 符号全反。
    ⚠️ ELSE 0 让缺失时点当 0 —— 数学上是分段求和，业务上**不等于**承认
       "缺失快照就是零"。要不要拒答由 L2 门禁决定，编译器不判断。

- id: G-009
  shape: comparison_delta_nested
  intent:
    metric: 不良贷款余额
    time:
      grain: month_end
      points: ["2026-04-30", "2026-01-31"]
    comparison: delta
  golden: G-009.sql
  covers: [C-05]
  why_hard: |
    不良余额的公式本身自带 CASE（五级分类 IN 30/40/50），所以时点条件必须注入到
    **聚合参数内部**，产出两层嵌套 CASE。如果实现把 CASE 套在聚合外面
    （CASE WHEN etl_dt = ... THEN SUM(...) ELSE 0 END），SQL 同样合法能跑，
    但 SUM 会先在整张表上聚合 —— 语义全错而且只返回一行，不报错不告警。
    另外这条钉住"什么指标能做 delta"：顶层必须是单个 SUM。不良**率**（顶层是除法）
    会被明确拒绝。这是 M2.1 的显式边界，不是悄悄降级。
