# 本地提交钩子。目标：格式化问题在本地就被挡掉，不必等 CI。
#
# 安装：uv run pre-commit install
# 手动全跑：uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff check (new engine only)
        args: [--fix]
        # legacy 目录显式排除，交给 CI 的可见性 job
        exclude: ^app/legacy/
      - id: ruff-format
        name: ruff format (new engine only)
        exclude: ^app/legacy/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
